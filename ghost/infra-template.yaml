version: "1"

# Template metadata
name: ghost
description: Ghost is a powerful, modern publishing platform for creating professional blogs and publications with a clean, minimalist interface.
icon: https://raw.githubusercontent.com/docker-library/docs/master/ghost/logo.png
category: cms
tags:
  - cms
  - blogging
  - publishing
  - newsletter
  - content-management

# Supported versions
versions:
  - "5"
  - "4"
defaultVersion: "5"

# Service definitions
services:
  - name: ghost-db
    type: worker
    image: "mariadb:11"
    ports:
      - port: 3306
    env:
      - key: MARIADB_DATABASE
        value: ghost
        description: Database created for ghost on first boot.
      - key: MARIADB_USER
        value: ghost
        description: Application database user.
      - key: MARIADB_PASSWORD
        generator: password
        length: 32
        description: Generated password for the ghost database user.
      - key: MARIADB_ROOT_PASSWORD
        generator: password
        length: 32
        description: Generated MariaDB root password.
    volumes:
      - name: ghost-db-data
        path: /var/lib/mysql
        size: 5120
    health_check:
      type: exec
      command:
        - healthcheck.sh
        - "--connect"
      initial_delay: 20
      interval: 10
      timeout: 5
      retries: 5
    cpu: 200
    memory: 512

  - name: ghost
    type: web
    image: "ghost:${VERSION}"
    ports:
      - port: 2368
    env:
      - key: url
        value: "${PUBLIC_URL}"
        description: Public address of this site; the platform fills in the hostname it assigns.
      - key: database__client
        value: mysql
        description: Database client type
      - key: database__connection__host
        value: "ghost-db"
        description: The bundled MariaDB service, reachable by service name.
      - key: database__connection__port
        default: "3306"
        configurable: true
        description: MySQL/MariaDB port
      - key: database__connection__user
        from: ghost-db.MARIADB_USER
        description: Taken from the bundled database service.
      - key: database__connection__password
        from: ghost-db.MARIADB_PASSWORD
        description: Taken from the bundled database service.
      - key: database__connection__database
        from: ghost-db.MARIADB_DATABASE
        description: Taken from the bundled database service.
      - key: mail__transport
        default: "Direct"
        configurable: true
        description: Mail transport method (SMTP, Direct)
    volumes:
      - name: ghost-content
        path: /var/lib/ghost/content
        size: 10240
    health_check:
      type: http
      path: /ghost/api/v4/admin/site/
      port: 2368
      initial_delay: 30
      interval: 30
      timeout: 10
      retries: 3
    cpu: 200
    memory: 512
    tcp_exposure:
      enabled: false
      hostname: "${NAME}-${STAGE}.${DOMAIN}"
      port: 2368
      tls:
        mode: terminate
      gateway:
        name: dms-gateway
        namespace: dms-system
