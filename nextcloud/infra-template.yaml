version: "1"

# Template metadata
name: nextcloud
description: Nextcloud is a self-hosted productivity platform providing file sync and share, collaborative document editing, calendars, contacts, and more.
icon: https://raw.githubusercontent.com/nextcloud/server/master/core/img/logo/logo.svg
category: storage
tags:
  - storage
  - file-sync
  - collaboration
  - office
  - cloud-storage

# Supported versions
versions:
  - "28"
  - "27"
  - "26"
defaultVersion: "28"

# Service definitions
services:
  - name: nextcloud-db
    type: worker
    image: "postgres:17-alpine"
    ports:
      - port: 5432
    env:
      - key: POSTGRES_DB
        from: nextcloud.POSTGRES_DB
        description: Taken from the nextcloud service, which owns the value.
      - key: POSTGRES_USER
        from: nextcloud.POSTGRES_USER
        description: Taken from the nextcloud service, which owns the value.
      - key: POSTGRES_PASSWORD
        from: nextcloud.POSTGRES_PASSWORD
        description: Taken from the nextcloud service, which owns the value.
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
        description: A subdirectory of the mount, so initdb does not trip over lost+found.
    volumes:
      - name: nextcloud-db-data
        path: /var/lib/postgresql/data
        size: 5120
    health_check:
      type: exec
      command:
        - pg_isready
        - "-U"
        - nextcloud
      initial_delay: 10
      interval: 10
      timeout: 5
      retries: 5
    cpu: 200
    memory: 512

  - name: nextcloud
    type: web
    image: "nextcloud:${VERSION}"
    ports:
      - port: 80
    env:
      - key: POSTGRES_HOST
        value: "nextcloud-db"
        description: The bundled PostgreSQL service, reachable by service name.
      - key: POSTGRES_DB
        default: nextcloud
        configurable: true
        description: Database name
      - key: POSTGRES_USER
        default: nextcloud
        configurable: true
        description: Database username
      - key: POSTGRES_PASSWORD
        generator: password
        description: Database password
      - key: NEXTCLOUD_ADMIN_USER
        default: admin
        configurable: true
        description: Admin username
      - key: NEXTCLOUD_ADMIN_PASSWORD
        generator: password
        description: Admin password
      - key: NEXTCLOUD_TRUSTED_DOMAINS
        default: "localhost"
        configurable: true
        description: Space-separated list of trusted domains
      - key: OVERWRITEPROTOCOL
        default: "http"
        configurable: true
        description: Protocol for URL generation (http or https)
    volumes:
      - name: nextcloud-data
        path: /var/www/html
        size: 4096
    health_check:
      type: http
      path: /status.php
      port: 80
      initial_delay: 60
      interval: 30
      timeout: 10
      retries: 5
    cpu: 200
    memory: 512
    tcp_exposure:
      enabled: false
      hostname: "${NAME}-${STAGE}.${DOMAIN}"
      port: 80
      tls:
        mode: terminate
      gateway:
        name: infrasutra-gateway
        namespace: infrasutra-system
