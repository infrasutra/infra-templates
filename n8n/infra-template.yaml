version: "1"

# Template metadata
name: n8n
description: n8n is a powerful workflow automation tool that lets you connect apps and automate tasks, offering a self-hosted alternative to Zapier with 200+ integrations.
icon: https://raw.githubusercontent.com/n8n-io/n8n/master/assets/n8n-logo.png
category: automation
tags:
  - automation
  - workflow
  - integration
  - zapier-alternative
  - no-code

# Supported versions
versions:
  - "2.28.2"
  - "1.123.61"
defaultVersion: "2.28.2"

# Service definitions
services:
  - name: n8n-db
    type: worker
    image: "postgres:17-alpine"
    ports:
      - port: 5432
    env:
      - key: POSTGRES_DB
        value: n8n
        description: Database created for n8n on first boot.
      - key: POSTGRES_USER
        value: n8n
        description: Application database user.
      - key: POSTGRES_PASSWORD
        generator: password
        length: 32
        description: Generated password for the n8n database user.
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
        description: A subdirectory of the mount, so initdb does not trip over lost+found.
    volumes:
      - name: n8n-db-data
        path: /var/lib/postgresql/data
        size: 5120
    health_check:
      type: exec
      command:
        - pg_isready
        - "-U"
        - n8n
      initial_delay: 10
      interval: 10
      timeout: 5
      retries: 5
    cpu: 200
    memory: 512

  - name: n8n
    type: web
    image: "n8nio/n8n:${VERSION}"
    ports:
      - port: 5678
    env:
      - key: N8N_BASIC_AUTH_ACTIVE
        default: "true"
        configurable: true
        description: Enable basic authentication
      - key: N8N_BASIC_AUTH_USER
        default: admin
        configurable: true
        description: Basic auth username
      - key: N8N_BASIC_AUTH_PASSWORD
        generator: password
        description: Basic auth password
      - key: N8N_ENCRYPTION_KEY
        generator: password
        description: Key for encrypting credentials
      - key: DB_TYPE
        value: postgresdb
        description: Database type
      - key: DB_POSTGRESDB_HOST
        value: "n8n-db"
        description: The bundled PostgreSQL service, reachable by service name.
      - key: DB_POSTGRESDB_PORT
        default: "5432"
        configurable: true
        description: PostgreSQL port
      - key: DB_POSTGRESDB_DATABASE
        from: n8n-db.POSTGRES_DB
        description: Taken from the bundled database service.
      - key: DB_POSTGRESDB_USER
        from: n8n-db.POSTGRES_USER
        description: Taken from the bundled database service.
      - key: DB_POSTGRESDB_PASSWORD
        from: n8n-db.POSTGRES_PASSWORD
        description: Taken from the bundled database service.
      - key: N8N_HOST
        default: "localhost"
        configurable: true
        description: Host name for n8n
      - key: N8N_PROTOCOL
        default: "http"
        configurable: true
        description: Protocol (http or https)
      - key: WEBHOOK_URL
        default: "http://localhost:5678/"
        configurable: true
        description: URL for webhooks
    volumes:
      - name: n8n-data
        path: /home/node/.n8n
        size: 5120
    health_check:
      type: http
      path: /healthz
      port: 5678
      initial_delay: 30
      interval: 30
      timeout: 10
      retries: 3
    cpu: 200
    memory: 512
    tcp_exposure:
      enabled: false
      hostname: "${NAME}-${STAGE}.${DOMAIN}"
      port: 5678
      tls:
        mode: terminate
      gateway:
        name: dms-gateway
        namespace: dms-system
