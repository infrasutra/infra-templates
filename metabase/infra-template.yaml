version: "1"

# Template metadata
name: metabase
description: Metabase is an open-source business intelligence tool that lets anyone in your organization ask questions and learn from data with beautiful dashboards.
icon: https://raw.githubusercontent.com/metabase/metabase/master/docs/images/metabase-logo.svg
category: analytics
tags:
  - analytics
  - business-intelligence
  - dashboards
  - data-visualization
  - sql

# Supported versions
versions:
  - "v0.62.3"
  - "v0.61.6"
  - "v0.60.11"
defaultVersion: "v0.62.3"

# Service definitions
services:
  - name: metabase-db
    type: worker
    image: "postgres:17-alpine"
    ports:
      - port: 5432
    env:
      - key: POSTGRES_DB
        value: metabase
        description: Database created for metabase on first boot.
      - key: POSTGRES_USER
        value: metabase
        description: Application database user.
      - key: POSTGRES_PASSWORD
        generator: password
        length: 32
        description: Generated password for the metabase database user.
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
        description: A subdirectory of the mount, so initdb does not trip over lost+found.
    volumes:
      - name: metabase-db-data
        path: /var/lib/postgresql/data
        size: 5120
    health_check:
      type: exec
      command:
        - pg_isready
        - "-U"
        - metabase
      initial_delay: 10
      interval: 10
      timeout: 5
      retries: 5
    cpu: 200
    memory: 512

  - name: metabase
    type: web
    image: "metabase/metabase:${VERSION}"
    ports:
      - port: 3000
    env:
      - key: MB_DB_TYPE
        value: postgres
        description: Application database type
      - key: MB_DB_HOST
        value: "metabase-db"
        description: The bundled PostgreSQL service, reachable by service name.
      - key: MB_DB_PORT
        default: "5432"
        configurable: true
        description: PostgreSQL port
      - key: MB_DB_DBNAME
        from: metabase-db.POSTGRES_DB
        description: Taken from the bundled database service.
      - key: MB_DB_USER
        from: metabase-db.POSTGRES_USER
        description: Taken from the bundled database service.
      - key: MB_DB_PASS
        from: metabase-db.POSTGRES_PASSWORD
        description: Taken from the bundled database service.
      - key: MB_ENCRYPTION_SECRET_KEY
        generator: password
        description: Encryption key for sensitive data
    volumes:
      - name: metabase-data
        path: /metabase-data
        size: 5120
    health_check:
      type: http
      path: /api/health
      port: 3000
      initial_delay: 60
      interval: 30
      timeout: 10
      retries: 5
    cpu: 500
    memory: 2048
    tcp_exposure:
      enabled: false
      hostname: "${NAME}-${STAGE}.${DOMAIN}"
      port: 3000
      tls:
        mode: terminate
      gateway:
        name: infrasutra-gateway
        namespace: infrasutra-system
