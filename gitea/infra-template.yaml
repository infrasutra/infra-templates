version: "1"

# Template metadata
name: gitea
description: Gitea is a lightweight, self-hosted Git service providing repository hosting, code review, issue tracking, and CI/CD workflows.
icon: https://raw.githubusercontent.com/go-gitea/gitea/main/public/assets/img/logo.svg
category: devops
tags:
  - devops
  - git
  - source-control
  - ci-cd
  - self-hosted

# Supported versions
versions:
  - "1.26"
  - "1.25"
  - "1.24"
defaultVersion: "1.26"

# Service definitions
services:
  - name: gitea-db
    type: worker
    image: "postgres:17-alpine"
    ports:
      - port: 5432
    env:
      - key: POSTGRES_DB
        value: gitea
        description: Database created for gitea on first boot.
      - key: POSTGRES_USER
        value: gitea
        description: Application database user.
      - key: POSTGRES_PASSWORD
        generator: password
        length: 32
        description: Generated password for the gitea database user.
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
        description: A subdirectory of the mount, so initdb does not trip over lost+found.
    volumes:
      - name: gitea-db-data
        path: /var/lib/postgresql/data
        size: 5120
    health_check:
      type: exec
      command:
        - pg_isready
        - "-U"
        - gitea
      initial_delay: 10
      interval: 10
      timeout: 5
      retries: 5
    cpu: 200
    memory: 512

  - name: gitea
    type: web
    image: "gitea/gitea:${VERSION}"
    ports:
      - port: 3000
      - port: 22
    env:
      - key: GITEA__database__DB_TYPE
        value: postgres
        description: Database type
      - key: GITEA__database__HOST
        value: "gitea-db:5432"
        description: The bundled PostgreSQL service, reachable by service name.
      - key: GITEA__database__NAME
        from: gitea-db.POSTGRES_DB
        description: Taken from the bundled database service.
      - key: GITEA__database__USER
        from: gitea-db.POSTGRES_USER
        description: Taken from the bundled database service.
      - key: GITEA__database__PASSWD
        from: gitea-db.POSTGRES_PASSWORD
        description: Taken from the bundled database service.
      - key: GITEA__security__SECRET_KEY
        generator: password
        description: Secret key for encryption
      - key: GITEA__security__INTERNAL_TOKEN
        generator: password
        description: Internal API token
    volumes:
      - name: gitea-data
        path: /data
        size: 10240
    health_check:
      type: http
      path: /api/healthz
      port: 3000
      initial_delay: 30
      interval: 30
      timeout: 10
      retries: 3
    cpu: 200
    memory: 512
    tcp_exposure:
      enabled: false
      hostname: "${NAME}-${STAGE}.${DOMAIN}"
      port: 3000
      tls:
        mode: terminate
      gateway:
        name: dms-gateway
        namespace: dms-system
