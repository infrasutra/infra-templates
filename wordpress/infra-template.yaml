version: "1"

# Template metadata
name: wordpress
description: WordPress is the world's most popular open-source content management system, powering over 40% of all websites with its flexible and extensible platform.
icon: https://raw.githubusercontent.com/docker-library/docs/master/wordpress/logo.png
category: cms
tags:
  - cms
  - blogging
  - website
  - php
  - content-management

# Supported versions
versions:
  - "6.4"
  - "6.3"
  - "php8.3-apache"
defaultVersion: "6.4"

# Service definitions
services:
  - name: wordpress-db
    type: worker
    image: "mariadb:11"
    ports:
      - port: 3306
    env:
      - key: MARIADB_DATABASE
        value: wordpress
        description: Database created for WordPress on first boot.
      - key: MARIADB_USER
        value: wordpress
        description: Application database user.
      - key: MARIADB_PASSWORD
        generator: password
        length: 32
        description: Generated password for the WordPress database user.
      - key: MARIADB_ROOT_PASSWORD
        generator: password
        length: 32
        description: Generated MariaDB root password.
    volumes:
      - name: wordpress-db-data
        path: /var/lib/mysql
        size: 5120
    health_check:
      type: exec
      command:
        - healthcheck.sh
        - "--connect"
      initial_delay: 20
      interval: 10
      timeout: 5
      retries: 5
    cpu: 200
    memory: 512

  - name: wordpress
    type: web
    image: "wordpress:${VERSION}"
    ports:
      - port: 80
    env:
      - key: WORDPRESS_DB_HOST
        value: "wordpress-db:3306"
        description: The bundled MariaDB service, reachable by service name.
      - key: WORDPRESS_DB_USER
        from: wordpress-db.MARIADB_USER
        description: Same user the bundled MariaDB created.
      - key: WORDPRESS_DB_PASSWORD
        from: wordpress-db.MARIADB_PASSWORD
        description: The password generated on the bundled MariaDB.
      - key: WORDPRESS_DB_NAME
        from: wordpress-db.MARIADB_DATABASE
        description: The database the bundled MariaDB created.
      - key: WORDPRESS_TABLE_PREFIX
        default: wp_
        configurable: true
        description: Database table prefix
      - key: WORDPRESS_DEBUG
        default: "false"
        configurable: true
        description: Enable WordPress debug mode
    volumes:
      - name: wordpress-data
        path: /var/www/html
        size: 10240
    health_check:
      type: http
      path: /wp-admin/install.php
      port: 80
      initial_delay: 30
      interval: 30
      timeout: 10
      retries: 3
    cpu: 200
    memory: 512
    tcp_exposure:
      enabled: false
      hostname: "${NAME}-${STAGE}.${DOMAIN}"
      port: 80
      tls:
        mode: terminate
      gateway:
        name: dms-gateway
        namespace: dms-system
